version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  exclusions:
    presets:
      # Unchecked errors from Close, fmt.Fprint* and similar.
      - std-error-handling
    rules:
      # Test handlers write canned responses; a failed write fails the test anyway.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/maraino/gh-inbox
